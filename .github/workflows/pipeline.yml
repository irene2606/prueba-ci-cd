name: Pipeline Multi-Fase Industrial

on: [push]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Linter
        run: pip install flake8
      - name: Ejecutar Flake8
        run: flake8 app.py

  pruebas:
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Pytest
        run: pip install pytest
      - name: Ejecutar Tests
        run: pytest test_app.py

  pruebas_base_datos:
    needs: pruebas
    runs_on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{secrets.DB_USER}}
          POSTGRES_PASSWORD: ${{secrets.DB_PASSWORD}}
          POSTGRES_DB: ${{secrets.DB_NAME}}
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install psycopg2-binary
      - name: Ejecutar script de base de pruebas_base_datos
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python insertar_sensor.py

  empaquetado:
    needs: prueba_base_datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t motor-app .